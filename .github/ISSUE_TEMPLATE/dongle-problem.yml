name: Dongle-Problem melden
description: Etwas funktioniert am PhoneBlock-Dongle nicht so, wie es soll.
title: "[Dongle] "
labels: ["dongle"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung! Bitte fülle die folgenden Felder aus, damit sich das Problem
        nachvollziehen lässt. Pflichtfelder sind mit \* markiert; alles andere ist hilfreich, aber optional.
        Fragen zur Einrichtung stellst du am besten in den Diskussionen:
        https://github.com/haumacher/phoneblock/discussions/categories/q-a

  - type: input
    id: hardware
    attributes:
      label: Hardware / Board
      description: Konkretes ESP32-DevKit. Falls nicht eindeutig, gerne Hersteller + USB-Serial-Chip.
      placeholder: "z. B. NodeMCU-32E (ESP-WROOM-32E, CP2102)"
    validations:
      required: true

  - type: input
    id: firmware-version
    attributes:
      label: Firmware-Version
      description: Steht in der Weboberfläche des Dongles in der Statuszeile („Firmware …").
      placeholder: "z. B. 1.7.0"
    validations:
      required: true

  - type: dropdown
    id: flash-method
    attributes:
      label: Flash-Methode
      options:
        - Browser-Installer (phoneblock.net/dongle-install)
        - ESP-IDF-Toolchain (idf.py flash)
        - sonstige
    validations:
      required: true

  - type: input
    id: router
    attributes:
      label: Router-Modell
      placeholder: "z. B. Fritz!Box 7590, Speedport Smart 4, Vodafone Station"
    validations:
      required: true

  - type: dropdown
    id: connection-type
    attributes:
      label: Anschlussart
      options:
        - DSL
        - Glasfaser (FTTH)
        - Kabel
        - Mobilfunk / LTE-Router
        - sonstige
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Telefonie-Provider
      options:
        - Telekom
        - Vodafone / Unitymedia
        - 1&1
        - o2 / Telefónica
        - Deutsche Glasfaser
        - sonstige
    validations:
      required: true

  - type: dropdown
    id: sip-source
    attributes:
      label: SIP-Registrierung
      description: Wo meldet sich der Dongle als IP-Telefon an?
      options:
        - Router (eigener SIP-Registrar)
        - direkt beim Telefonie-Provider
        - eigener / externer SIP-Server
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Was funktioniert nicht?
      description: |
        Bitte konkret: was hast du gemacht, was hast du erwartet, was ist passiert? Blockiert er keinen
        Spam, klingelt das echte Telefon trotzdem, hängt sich der Dongle auf, kommt er nicht ins WLAN?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log (optional)
      description: |
        Die Einträge aus dem Protokoll-Bereich der Weboberfläche (oder der seriellen Konsole).
        Bitte Telefonnummern unkenntlich machen.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Bestätigung
      options:
        - label: Ich habe vor dem Schreiben geprüft, ob das Problem nicht schon in einem offenen Issue beschrieben ist.
          required: true
