name: Build server release

# Builds the PhoneBlock server WAR (with the embedded answerbot UI) for every server release
# tag X.Y.Z created by the maven-release-plugin and attaches it, with its SHA-256, to the
# GitHub release. The WAR is environment-neutral; phoneblock/bin/pb-deploy fetches it from the
# release on the server. A workflow_dispatch run builds any ref and keeps the WAR as a workflow
# artifact (no release is created for a branch build).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build: a release tag (e.g. 3.2.7) or a branch'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Build answerbot UI
        working-directory: phoneblock_answerbot_ui
        run: |
          flutter pub get
          flutter build web --base-href /ab/

      - name: Build and test
        run: mvn -B install

      - name: Collect artifacts
        id: war
        shell: bash
        run: |
          WAR=$(ls phoneblock/target/phoneblock-*.war)
          cd "$(dirname "$WAR")"
          sha256sum "$(basename "$WAR")" > "$(basename "$WAR").sha256"
          echo "war=$WAR" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$WAR" .war | sed 's/^phoneblock-//')" >> "$GITHUB_OUTPUT"
          ls -l

      - name: Release notes
        id: notes
        shell: bash
        run: |
          NOTES="release-notes/${{ steps.war.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PhoneBlock ${{ steps.war.outputs.version }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            ${{ steps.war.outputs.war }}
            ${{ steps.war.outputs.war }}.sha256

      - name: Keep WAR as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: phoneblock-war
          path: |
            ${{ steps.war.outputs.war }}
            ${{ steps.war.outputs.war }}.sha256
