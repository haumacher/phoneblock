name: Build PhoneBlock Mobile

on:
  push:
    tags:
      - 'pb-mobile-*'
  pull_request:
    paths:
      - 'phoneblock_mobile/**'
      - 'phoneblock_shared/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Remove auto-translate plugin
        run: |
          sed -i '/auto-translate-arb/d' phoneblock_mobile/android/build.gradle
          sed -i '/auto-translate-arb/d' phoneblock_mobile/android/settings.gradle

      - name: Install dependencies
        working-directory: phoneblock_mobile
        run: flutter pub get

      - name: Analyze
        working-directory: phoneblock_mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup signing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > phoneblock_mobile/android/app/keystore.jks
          cat > phoneblock_mobile/android/key.properties <<EOL
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOL
          sed -i 's/^ *//' phoneblock_mobile/android/key.properties

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: phoneblock_mobile
        run: flutter build apk

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: phoneblock_mobile
        run: flutter build apk --debug

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          VERSION_CODE=$(sed -n -E 's/^version:.+\+([0-9]+)$/\1/p' phoneblock_mobile/pubspec.yaml)
          # A pre-release tag (pb-mobile-1.4.0-rc1) names the release after the tag.
          echo "name=PhoneBlock Mobile ${GITHUB_REF_NAME#pb-mobile-}" >> "$GITHUB_OUTPUT"
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "body_path=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.name }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: phoneblock_mobile/build/app/outputs/flutter-apk/app-release.apk
          # -rcN tags are previews: a GitHub pre-release only, no Play Store upload.
          prerelease: ${{ contains(github.ref_name, '-rc') }}

      # Google Play accepts only app bundles. Only final releases are uploaded, to the
      # internal testing track; promotion to production happens by hand in the Play Console.
      - name: Build release app bundle
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc')
        working-directory: phoneblock_mobile
        run: flutter build appbundle

      - name: Prepare Play release notes
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc')
        run: |
          mkdir -p play-whatsnew
          if [ -n "${{ steps.changelog.outputs.body_path }}" ]; then
            if [ "$(wc -c < "${{ steps.changelog.outputs.body_path }}")" -gt 500 ]; then
              echo "::error::${{ steps.changelog.outputs.body_path }} exceeds the 500-character Play Store limit"
              exit 1
            fi
            cp "${{ steps.changelog.outputs.body_path }}" play-whatsnew/whatsnew-en-US
          fi

      - name: Upload to Google Play (internal testing)
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.haumacher.phoneblock_mobile
          releaseFiles: phoneblock_mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: play-whatsnew
