# "The cookie-swallowing firewall": nginx imitating Home Assistant ingress
# (#619, #621). Only the behaviour that matters for the sign-in is copied:
#
#  * "/" is the shell page. It sets the ingress session cookie like HA does
#    (HttpOnly, SameSite=Strict, path /api/hassio_ingress/) and shows the
#    service in an iframe below the ingress prefix.
#  * Below /api/hassio_ingress/<token>/ a request without that cookie gets
#    HA's "401: Unauthorized". A browser omits a SameSite=Strict cookie on
#    any navigation another site started — so a redirect from phoneblock.net
#    back into the prefix is refused, while the same URL pasted into the
#    address bar (or opened from the shell) works.
#  * With the cookie the request goes to the service with the prefix
#    stripped and X-Ingress-Path set, as HA's supervisor does.
#
# Token and session value are fixed test values, not secrets.

server {
    listen 8123;
    default_type text/plain;
    # Relative Location headers: the host port differs from the listen port.
    absolute_redirect off;
    client_max_body_size 4m;   # the own dialog set upload (2 MiB)

    location = / {
        add_header Set-Cookie "ingress_session=pbtest-session; Path=/api/hassio_ingress/; HttpOnly; SameSite=Strict" always;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/shell;
        try_files /index.html =404;
    }

    # HA redirects the bare prefix to its slash form.
    location = /api/hassio_ingress/pbtest-ingress-token {
        if ($cookie_ingress_session != "pbtest-session") {
            return 401 "401: Unauthorized";
        }
        return 301 /api/hassio_ingress/pbtest-ingress-token/;
    }

    location /api/hassio_ingress/pbtest-ingress-token/ {
        if ($cookie_ingress_session != "pbtest-session") {
            return 401 "401: Unauthorized";
        }
        # The trailing slash strips the prefix: .../token/api/status → /api/status.
        proxy_pass http://phoneblock:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Ingress-Path /api/hassio_ingress/pbtest-ingress-token;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Any other ingress token: unknown session.
    location /api/hassio_ingress/ {
        return 401 "401: Unauthorized";
    }

    location / {
        return 404 "404: Not Found";
    }
}

# A page on "another site" for reproducing obstacle 3 by hand: a link from
# here into the ingress prefix is a cross-site navigation, like the redirect
# from phoneblock.net. Open it under a different host name than the shell
# (http://localhost:<port> when the shell is at http://<LAN-IP>:<port>):
# sites are compared by host, not by port.
server {
    listen 8124;
    location / {
        root /usr/share/nginx/foreign;
        try_files /index.html =404;
    }
}
