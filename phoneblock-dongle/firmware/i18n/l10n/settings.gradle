// Standalone Gradle project that translates the dongle's German string
// sources into the other locales using the SAME plugin the mobile app uses
// (de.haumacher:auto-translate-arb), at development time. Its outputs
// (mail_<lang>.arb, ui_<lang>.arb) are committed to git; the release script
// only assembles those committed files — no translation runs at release time.
//
// Run:  cd i18n/l10n && gradle translateArb   (Gradle 8.x)
//       Needs the DeepL key as the Gradle property `deepl.apiKey` in
//       ~/.gradle/gradle.properties (the `serverId = 'deepl'` below names that
//       property), or DEEPL_API_KEY in the environment. NOT the `deepl` server
//       in ~/.m2/settings.xml — that store feeds the Maven-side translation of
//       the web app's Messages_*.properties, which is a different plugin.
pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'dongle-i18n'
include 'mail', 'ui'
