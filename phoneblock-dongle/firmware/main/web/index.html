<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// All URLs of the UI are relative (api/status, ab-logo-bot.svg), so the app
// also works below a reverse proxy's mount path such as Home Assistant's
// ingress. They resolve against this page's address, which must end in "/";
// a mount opened without it (/phoneblock instead of /phoneblock/) gets it here.
if (!location.pathname.endsWith('/'))
  history.replaceState(null, '', location.pathname + '/' + location.search + location.hash);
</script>
<link rel="icon" type="image/svg+xml" href="ab-logo-bot.svg">
<title>PhoneBlock Dongle</title>
<style>
  /* Colour tokens: the fixed states a message or mark can be in. JS uses
     them as var(--…) too, so a state has one colour everywhere. */
  :root{--brand:#008f7a;--ok:#188038;--err:#d93025;--warn:#e8710a;
        --caution:#b06000;--info:#1a73e8;--muted:#888;--text:#222;--text2:#444}
  *{box-sizing:border-box}
  /* The hidden attribute must win over class rules like .actions{display:flex}. */
  [hidden]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
       margin:0;background:#f5f5f7;color:var(--text);line-height:1.45}
  header{background:var(--brand);color:#fff;padding:.8rem 1rem;
         display:flex;align-items:center;gap:.6rem}
  header img{display:block;width:32px;height:32px}
  header h1{margin:0;font-size:1.25rem;font-weight:600;flex:1}
  header a{color:#cdeee7;text-decoration:none;font-size:.9rem}
  header a:hover{color:#fff}
  main{max-width:900px;margin:0 auto;padding:1rem}
  section{background:#fff;border-radius:8px;padding:1rem;margin-bottom:1rem;
          box-shadow:0 1px 2px rgba(0,0,0,.06)}
  h2{margin:0 0 .6rem;font-size:.85rem;color:#555;text-transform:uppercase;
     letter-spacing:.6px;font-weight:600;border-bottom:1px solid #eee;
     padding-bottom:.4rem}
  /* Collapsible admin/config card: same look as a section, with the
     title as a clickable summary. Collapsed = compact (no underline);
     open = h2-style header with the bottom rule. */
  details.adminsec{background:#fff;border-radius:8px;padding:1rem;
     margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  summary{cursor:pointer}   /* every disclosure is clickable, nested ones too */
  details.adminsec>summary{margin:0;font-size:.85rem;color:#555;
     text-transform:uppercase;letter-spacing:.6px;font-weight:600;
     cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem}
  details.adminsec>summary::-webkit-details-marker{display:none}
  details.adminsec>summary::before{content:'\25B8';color:#aaa;font-size:.9rem}
  details.adminsec[open]>summary{border-bottom:1px solid #eee;
     padding-bottom:.4rem;margin-bottom:.6rem}
  details.adminsec[open]>summary::before{content:'\25BE'}
  h3{margin:1rem 0 .4rem;font-size:1rem;font-weight:600;color:#222}
  .pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;
        font-size:.85rem;font-weight:600}
  .ok{background:#d4edda;color:#155724}
  .bad{background:#f8d7da;color:#721c24}
  .warn{background:#fff3cd;color:#856404}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.5rem}
  .stat{padding:.6rem;background:#fafafa;border-radius:4px;text-align:center}
  .stat-label{font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:.3px}
  .stat-value{font-size:1.6rem;font-weight:600;color:var(--brand);line-height:1.2}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  td,th{padding:.4rem .5rem;text-align:left;border-bottom:1px solid #eee}
  th{font-weight:600;color:#666;font-size:.75rem;text-transform:uppercase;letter-spacing:.3px}
  .v-SPAM{color:var(--err);font-weight:600}
  .v-LEGITIMATE{color:var(--ok)}
  .v-SUSPECT{color:var(--warn);font-weight:500}
  .v-UNKNOWN{color:var(--muted)}
  .v-ERROR{color:var(--warn)}
  .muted{color:var(--muted);font-size:.85rem}
  .i18n-bubble{margin:.7rem 0 0;padding:.55rem .9rem;border-radius:.7rem;
    background:#e67e22;color:#fff;font-size:.9rem;font-weight:600;
    box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .i18n-bubble.failed{background:#c0392b}
  /* Log line; the level (lvl-E/W/I) colours the left border and the tag. */
  .error-row{border-left:3px solid var(--err);padding:.2rem .5rem;margin-bottom:.35rem;
             font-size:.9rem;background:#fffafa}
  .error-row strong{color:var(--err)}
  .error-row.lvl-W{border-left-color:var(--warn);background:#fffdf6}
  .error-row.lvl-W strong{color:var(--warn)}
  .error-row.lvl-I{border-left-color:var(--muted);background:#fafafa}
  .error-row.lvl-I strong{color:var(--muted)}
  .login-error{color:var(--err);background:#fce8e6;border-left:3px solid var(--err);
               padding:.6rem .8rem;border-radius:4px;margin:.4rem 0 1rem}
  label{display:block;margin:.6rem 0 .2rem;font-size:.8rem;color:#555}
  input, select{width:100%;padding:.4rem;border:1px solid #ccc;border-radius:4px;
        font-size:.95rem;font-family:inherit}
  input:read-only{background:#fafafa;color:#555}
  .btn-primary{background:var(--brand);color:#fff;border:0;padding:.55rem 1.2rem;
               border-radius:4px;font-size:1rem;cursor:pointer;font-family:inherit;
               text-decoration:none;display:inline-block}
  .btn-primary:disabled{background:#aaa;cursor:wait}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;
    align-items:center;justify-content:center;padding:1rem;z-index:50}
  .modal>div{background:#fff;border-radius:8px;padding:1.2rem;max-width:24rem;
    width:100%;box-shadow:0 4px 24px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 .6rem;font-size:1rem}
  /* Row actions in the call list. Labelled pills, not bare glyphs: a "+"
     alone does not say what it adds, and the spam vote next to it is
     public and irreversible — both need to read unambiguously. */
  .rowbtn{display:inline-flex;align-items:center;gap:.2rem;background:#fff;
    border:1px solid var(--brand);color:var(--brand);border-radius:999px;
    padding:.1rem .5rem;font-size:.72rem;line-height:1.5;cursor:pointer;
    width:auto;margin:0;white-space:nowrap;text-transform:none;
    letter-spacing:0;font-weight:500}
  .rowbtn:hover{background:#e6f5f2}
  .rowbtn.spam{border-color:var(--err);color:var(--err)}
  .rowbtn.spam:hover{background:#fdecea}
  .rowbtn[disabled]{opacity:.5;cursor:default}
  .btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);
             padding:.55rem 1.2rem;border-radius:4px;font-size:1rem;
             cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .hero{background:linear-gradient(135deg,var(--brand),#00b894);color:#fff;
        border-radius:8px;padding:1.5rem;margin-bottom:1rem}
  .hero h2{color:#fff;border-bottom:1px solid rgba(255,255,255,.3)}
  .hero p{margin:.4rem 0}
  .hero .btn-primary{background:#fff;color:var(--brand);margin-top:.4rem}
  .hero-step{display:flex;align-items:center;gap:.8rem;
             padding:.8rem 1rem;margin-top:.8rem;
             background:rgba(255,255,255,.12);border-radius:6px}
  .hero-step .mark{display:flex;align-items:center;justify-content:center;
                   width:1.8rem;height:1.8rem;flex-shrink:0;
                   border-radius:50%;font-weight:700;font-size:1rem;
                   background:rgba(255,255,255,.18);color:#fff}
  .hero-step.done .mark{background:#fff;color:var(--brand)}
  .hero-step .body{flex:1;min-width:0}
  .hero-step .body strong{display:block;font-size:1rem}
  .choice{display:block;padding:1rem;background:#fafafa;border:1px solid #e0e0e0;
          border-radius:6px;margin-bottom:.6rem;text-decoration:none;color:inherit}
  .choice:hover{border-color:var(--brand);background:#f0f9f6}
  .choice strong{color:var(--brand);display:block;margin-bottom:.2rem}
  .cta-row{margin:.4rem 0 .2rem}
  .status-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
              margin:.4rem 0}
  .status-row .pill{min-width:10rem;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1rem}
  footer a{color:var(--muted)}
  .crumb{font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
  .crumb a{color:var(--brand);text-decoration:none}
  .crumb a:hover{text-decoration:underline}

  /* ---- Shared vocabulary for the markup the views build in JS: one class
     per role, so equal elements look and behave the same everywhere. ---- */
  /* Button sizes. .btn-primary has no border, .btn-ghost a 1px one: the
     primary variant gets 1px more padding so both line up in one row. */
  .btn-sm{padding:.3rem .7rem;font-size:.85rem}
  .btn-primary.btn-sm{padding:calc(.3rem + 1px) calc(.7rem + 1px)}
  /* Mini button next to a heading or a line of text (no h2 caps). */
  .btn-xs{padding:.2rem .6rem;font-size:.75rem;text-transform:none;letter-spacing:0}
  .btn-danger{border-color:var(--err);color:var(--err)}
  label.btn-ghost{margin:0}
  /* A row of actions: buttons, then an inline status message (.after).
     Hidden buttons take no gap, so toggling one never shifts the rest. */
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.6rem 0}
  .after{margin-left:.6rem}
  .actions .after{margin-left:.3rem}
  .modal .actions{margin-top:.8rem}
  .modal .actions>button{padding:.4rem .9rem}
  .modal .actions>.btn-primary{padding:calc(.4rem + 1px) calc(.9rem + 1px)}
  /* One line of state (current value, progress, outcome); .msg-line keeps
     its height while empty so the layout does not jump. */
  .status-line{margin:.4rem 0}
  .msg-line{min-height:1em;margin:.4rem 0}
  .info-line{margin:.2rem 0}
  /* Help text: .help explains a block, .hint a single field or option. */
  .help{color:var(--muted);font-size:.8rem;margin:.5rem 0 .8rem}
  .hint{color:var(--muted);font-size:.75rem;margin:.2rem 0 .6rem}
  .hint:last-child{margin-bottom:0}
  .callout{color:var(--muted);font-size:.75rem;margin:.6rem 0;
     border-left:3px solid #ccc;padding-left:.6rem}
  /* Text tones for a fixed state (after .help/.hint, so they win). */
  .txt-err{color:var(--err)}
  .txt-ok{color:var(--ok)}
  /* The user code of the device-code link (#621), typed in on phoneblock.net. */
  .link-row{display:flex;align-items:center;flex-wrap:wrap;gap:.8rem;margin:.6rem 0}
  .link-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     font-size:2rem;font-weight:700;letter-spacing:.15em;margin:0;user-select:all}
  .txt-caution{color:var(--caution)}
  /* A checkbox (or a short select) with its text on one line; .opt is the
     paragraph wrapping one such option inside a group. */
  .check{display:flex;align-items:center;gap:.4rem;margin:.6rem 0 .2rem;
     font-size:.85rem;font-weight:400;color:var(--text2)}
  .check>input,.check>select{width:auto;margin:0}
  .check>select{min-width:0}   /* may shrink: a long option must not widen the page */
  .opt{margin:.6rem 0 .2rem}
  .opt>.check{margin:0}
  h2 .check{font-size:.75rem;gap:.3rem}
  /* Value fields side by side: caption, control, hint stacked. */
  .fields{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:flex-start}
  .field{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem}
  .field .hint{max-width:16rem;margin:0}
  .w-num{width:7rem}
  .w-pick{min-width:14rem}
  label>input[type=file]{margin-top:.3rem}
  /* A narrow settings form; .stack spaces several fields evenly. */
  .form{max-width:24rem;margin-top:.6rem}
  .form label{font-size:.85rem}
  .stack{display:flex;flex-direction:column;gap:.5rem}
  textarea{width:100%;font:inherit}
  /* Nested disclosure inside a card or a form. */
  details.sub{margin:.6rem 0;font-size:.85rem}
  details.sub>summary{font-size:.9rem;color:var(--brand)}
  /* Small heading and rows of a list (dialog speakers, editor phases). */
  .list{font-size:.85rem}
  .list-title{margin:.5rem 0 .2rem;font-size:.85rem;font-weight:600}
  .list-row{display:flex;align-items:center;gap:.3rem;margin:.15rem 0}
  .list-row .on{font-weight:600}
  /* A card heading with controls on the right. */
  h2.bar{display:flex;align-items:center;justify-content:space-between;
     flex-wrap:wrap;gap:.6rem}
  h2.bar .tools{display:flex;align-items:center;gap:.8rem}
  .counters{margin-top:.8rem}
  .tasks{font-size:.8rem;margin-top:.8rem}
  .num{text-align:right}
  /* Every card ends on its padding, whatever its last element is. */
  section>:last-child,details.adminsec>:last-child{margin-bottom:0}
  footer select{font-size:.8rem;border:none;background:transparent;color:var(--muted)}
</style>
</head>
<body>
<header>
  <img src="ab-logo-bot.svg" alt="" width="32" height="32">
  <h1>PhoneBlock Dongle</h1>
  <a href="#/" id="homeLink"></a>
</header>
<main id="app"></main>
<footer>
  PhoneBlock Dongle · <a href="https://phoneblock.net">phoneblock.net</a> ·
  <select id="langSelect">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="nl">Nederlands</option>
    <option value="pl">Polski</option>
    <option value="sv">Svenska</option>
    <option value="da">Dansk</option>
    <option value="nb">Norsk bokmål</option>
    <option value="uk">Українська</option>
    <option value="el">Ελληνικά</option>
    <option value="ar">العربية</option>
    <option value="zh">中文</option>
  </select>
</footer>

<script>
// --- i18n -----------------------------------------------------------

const I18N = {};

// The UI language is the device's ui_lang. All strings are loaded at runtime
// from the dongle (/api/i18n/ui); nothing is baked into this page. The device
// serves the active locale's pack, or the embedded English pack as a fallback,
// so t() falls back to the English pack (always present) then to the key.
let LANG = 'en';   // the device's ui_lang, filled in from /api/status on boot
const t = (k, p) => {
  // (… || {}) so a locale still loading can't throw.
  let s = (I18N[LANG] || {})[k];
  if (s === undefined) s = (I18N.en || {})[k];
  if (s === undefined) return k;
  if (p) for (const [name, val] of Object.entries(p))
    s = s.replaceAll('{' + name + '}', val);
  return s;
};

// The UI language is a DEVICE setting (ui_lang — it also drives the status
// mail and the answer-bot announcement). NOTHING is baked into this page: the
// dongle serves the strings for its ui_lang from /api/i18n/ui (same-origin) —
// either the locale pack the firmware downloaded to its storage, or the baked-in
// English fallback (from i18n/l10n/ui/ui_en.arb) when that locale isn't
// available yet. So a configured dongle needs no CDN at runtime (issue #460).
//
// Each served pack carries "@@locale"; while a just-selected locale is still
// downloading (or offline), the device serves the English fallback
// (@@locale:"en"), a readable placeholder — we keep polling until it serves
// the real locale. German is a normal downloaded locale (no special-casing).
function storePack(reqLang, dict){
  if (!dict || typeof dict !== 'object') return null;
  const loc = dict['@@locale'] || reqLang;
  I18N[loc] = dict;        // under the actual served locale (populates en too)
  I18N[reqLang] = dict;    // and under what was asked, so t(LANG) resolves
  return loc;
}
// Switching language is not instant: the device downloads the new pack (UI +
// mail + audio, several seconds) before /api/i18n/ui serves it. Without feedback
// a user picks a language and "nothing happens". Show a prominent bubble below
// the PhoneBlock token display — orange "loading" while we poll, which simply
// DISAPPEARS once the real pack renders (no "OK" noise), or a red note if it
// never arrives (the page then stays on the embedded English pack). The text
// resolves via t()'s English fallback, so it is readable even before the chosen
// locale's pack exists.
//
// The state is global so it survives a route()/renderStatus rebuild: the bubble
// element is recreated by renderStatus, which then calls applyLangStatus() to
// restore the current state.
let g_i18nStatus = '';   // '' | 'loading' | 'unavailable'
function setLangStatus(kind){ g_i18nStatus = kind || ''; applyLangStatus(); }

// The device's view of the localized-asset download (status.i18n), refreshed by
// every /api/status poll. The page asks it whether a pack is still coming
// instead of inferring that from /api/i18n/ui serving the English fallback —
// which is indistinguishable from "it will never come" and used to cost a
// 60-second poll on every page load.
let g_i18nState = null;
function noteI18nState(st){ if (st) g_i18nState = st; }
// True while the device could still produce a pack for `lang`: it has never
// synced, a pass is in flight, or the last pass was about a different locale
// (a switch was just requested — the trigger runs on the scheduler task, so
// `running` is briefly still false). Unknown state (no status yet) counts as
// "wait": better a short orange bubble than a wrong red one.
function i18nPackPending(lang){
  const st = g_i18nState;
  if (!st) return true;
  if (st.have_ui_pack) return true;      // present; the next fetch serves it
  return !st.ever_ran || !!st.running || st.sync_lang !== lang;
}
function applyLangStatus(){
  const el = document.getElementById('langStatus');   // only on the status page
  if (!el) return;
  if (!g_i18nStatus) { el.style.display = 'none'; el.textContent = ''; return; }
  el.textContent = g_i18nStatus === 'loading' ? t('i18n.loading') : t('i18n.unavailable');
  el.classList.toggle('failed', g_i18nStatus !== 'loading');
  el.style.display = '';
}
function loadUiPack(lang){
  if (!lang) return Promise.resolve();
  return fetch('api/i18n/ui')
    .then(r => r.ok ? r.json() : null)
    .then(dict => { storePack(lang, dict); })
    .catch(() => { /* device unreachable → keys via t(); page is from it */ });
}
// The locales the device can serve = the selector's options (single source,
// no duplicated list).
function supportedLangs(){
  const sel = document.getElementById('langSelect');
  return sel ? Array.from(sel.options).map(o => o.value) : ['en'];
}

// --- country / dial prefix ------------------------------------------
// ISO 3166-1 alpha-2 → E.164 country calling code, generated from the
// server's location/country-codes.csv. Packed as one string because 246
// entries as object literals would be several KB of flash for no gain.
// Country *names* are deliberately absent: Intl.DisplayNames renders them
// in the active UI language, so adding a locale costs nothing here.
const COUNTRY_DIAL =
  'AD+376 AE+971 AF+93 AG+1 AI+1 AL+355 AM+374 AO+244 AQ+672 AR+54 AS+1 AT+43 AU+61 AW+297 ' +
  'AX+358 AZ+994 BA+387 BB+1 BD+880 BE+32 BF+226 BG+359 BH+973 BI+257 BJ+229 BL+590 BM+1 BN+673 ' +
  'BO+591 BQ+599 BR+55 BS+1 BT+975 BV+47 BW+267 BY+375 BZ+501 CA+1 CC+61 CD+243 CF+236 CG+242 ' +
  'CH+41 CI+225 CK+682 CL+56 CM+237 CN+86 CO+57 CR+506 CU+53 CV+238 CW+599 CX+61 CY+357 CZ+420 ' +
  'DE+49 DJ+253 DK+45 DM+1 DO+1 DZ+213 EC+593 EE+372 EG+20 EH+212 ER+291 ES+34 ET+251 FI+358 ' +
  'FJ+679 FK+500 FM+691 FO+298 FR+33 GA+241 GB+44 GD+1 GE+995 GF+594 GG+44 GH+233 GI+350 GL+299 ' +
  'GM+220 GN+224 GP+590 GQ+240 GR+30 GS+500 GT+502 GU+1 GW+245 GY+592 HK+852 HM+672 HN+504 ' +
  'HR+385 HT+509 HU+36 ID+62 IE+353 IL+972 IM+44 IN+91 IO+246 IQ+964 IR+98 IS+354 IT+39 JE+44 ' +
  'JM+1 JO+962 JP+81 KE+254 KG+996 KH+855 KI+686 KM+269 KN+1 KP+850 KR+82 KW+965 KY+1 KZ+7 ' +
  'LA+856 LB+961 LC+1 LI+423 LK+94 LR+231 LS+266 LT+370 LU+352 LV+371 LY+218 MA+212 MC+377 ' +
  'MD+373 ME+382 MF+590 MG+261 MH+692 MK+389 ML+223 MM+95 MN+976 MO+853 MP+1 MQ+596 MR+222 MS+1 ' +
  'MT+356 MU+230 MV+960 MW+265 MX+52 MY+60 MZ+258 NA+264 NC+687 NE+227 NF+672 NG+234 NI+505 ' +
  'NL+31 NO+47 NP+977 NR+674 NU+683 NZ+64 OM+968 PA+507 PE+51 PF+689 PG+675 PH+63 PK+92 PL+48 ' +
  'PM+508 PN+870 PR+1 PS+970 PT+351 PW+680 PY+595 QA+974 RE+262 RO+40 RU+7 RW+250 SA+966 SB+677 ' +
  'SC+248 SD+249 SE+46 SG+65 SI+386 SJ+47 SK+421 SL+232 SM+378 SN+221 SO+252 SR+597 SS+211 ' +
  'ST+239 SV+503 SX+1 SY+963 SZ+268 TC+1 TD+235 TF+262 TG+228 TH+66 TJ+992 TK+690 TL+670 TM+993 ' +
  'TN+216 TO+676 TR+90 TT+1 TV+688 TW+886 TZ+255 UA+380 UG+256 US+1 UY+598 UZ+998 VA+39 VC+1 ' +
  'VE+58 VG+1 VI+1 VN+84 VU+678 WF+681 WS+685 YE+967 YT+262 ZA+27 ZM+260 ZW+263';

// The dial prefix the device is on, mirrored from /api/status so the poll
// does not fight the selector while the user is changing it.
let DIAL_PREFIX = '+49';

// [{iso, dial, name}] sorted by localized country name. Falls back to the
// bare ISO code on browsers without Intl.DisplayNames.
function countryOptions(){
  let names = null;
  try { names = new Intl.DisplayNames([LANG, 'en'], {type: 'region'}); } catch (_){}
  const list = COUNTRY_DIAL.split(' ').map(tok => {
    const i = tok.indexOf('+');
    const iso = tok.slice(0, i);
    let name = iso;
    if (names){ try { name = names.of(iso) || iso; } catch (_){} }
    return {iso: iso, dial: tok.slice(i), name: name};
  });
  try { list.sort((a, b) => a.name.localeCompare(b.name, LANG)); }
  catch (_){ list.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)); }
  return list;
}

// Many countries share a dial prefix (+1 spans all of NANP, +44 the UK and
// the Crown dependencies), and the device stores only the prefix — so it
// cannot say *which* one was picked. Remember the ISO code locally so the
// selector shows the country this browser chose rather than whichever one
// happens to sort first among its prefix-mates.
function rememberCountry(iso){
  try { localStorage.setItem('pb_country', iso); } catch (_){}
}
function preferredCountry(){
  try { return localStorage.getItem('pb_country') || ''; } catch (_){ return ''; }
}

// Select the option carrying `dial`, preferring the country this browser
// last picked when several share the prefix (see rememberCountry).
function selectDial(sel, dial){
  const pref = preferredCountry();
  let fallback = -1;
  for (let i = 0; i < sel.options.length; i++){
    const o = sel.options[i];
    if (o.value !== dial) continue;
    if (o.dataset.iso === pref){ sel.selectedIndex = i; return; }
    if (fallback < 0) fallback = i;
  }
  if (fallback >= 0) sel.selectedIndex = fallback;
}

// Populate the region section's two selectors. Cheap to call repeatedly:
// the language list is copied once from the footer selector (still the
// single source of the supported locales), and the country list is rebuilt
// only when the UI language changed, since its labels are localized.
function fillRegionSelectors(){
  const langSel = document.getElementById('regionLang');
  const cSel    = document.getElementById('regionCountry');
  if (!langSel || !cSel) return;
  if (!langSel.options.length){
    const src = document.getElementById('langSelect');
    if (src) langSel.innerHTML = src.innerHTML;
    langSel.value = LANG;
    langSel.addEventListener('change', () => setUiLang(langSel.value));
  }
  if (cSel.dataset.lang !== LANG){
    const keep = cSel.value || DIAL_PREFIX;
    cSel.innerHTML = '';
    for (const c of countryOptions()){
      const o = document.createElement('option');
      o.value = c.dial;
      o.textContent = c.name + ' (' + c.dial + ')';
      o.dataset.iso = c.iso;
      cSel.appendChild(o);
    }
    cSel.dataset.lang = LANG;
    selectDial(cSel, keep);
  }
  if (!cSel.dataset.wired){
    cSel.dataset.wired = '1';
    cSel.addEventListener('change', () => {
      const opt = cSel.selectedOptions[0];
      if (opt) rememberCountry(opt.dataset.iso);
      setDialPrefix(cSel.value);
    });
  }
}

// Reflect the device's country/language in the selectors on every poll,
// but never while the user has one open — that would snap their choice
// back before the POST lands.
function syncRegionSelectors(s){
  if (s && typeof s.dial_prefix === 'string' && s.dial_prefix){
    DIAL_PREFIX = s.dial_prefix;
  }
  fillRegionSelectors();
  const cSel    = document.getElementById('regionCountry');
  const langSel = document.getElementById('regionLang');
  if (cSel    && document.activeElement !== cSel)    selectDial(cSel, DIAL_PREFIX);
  if (langSel && document.activeElement !== langSel) langSel.value = LANG;
}

// Persist the country on the device. Only the prefix travels — that is
// what normalize_e164() needs; which of the countries sharing it the user
// picked stays a local display detail.
function setDialPrefix(dial){
  DIAL_PREFIX = dial;
  try {
    fetch('api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ dial_prefix: dial }).toString(),
    }).catch(() => {});
  } catch (_){}
}
// Best supported match for the browser's preferred languages, or null. Matches
// exact ("en") then primary subtag ("en-US" -> "en"); folds the Norwegian
// variants (nn/no) onto nb, which is the one locale whose code isn't just the
// primary subtag of what a browser typically reports.
function pickBrowserLang(){
  const sup = supportedLangs();
  const prefs = (typeof navigator !== 'undefined' &&
                 (navigator.languages || [navigator.language])) || [];
  for (let raw of prefs){
    if (!raw) continue;
    const l = String(raw).toLowerCase();
    const primary = l.split('-')[0];
    if (sup.includes(l)) return l;
    if (sup.includes(primary)) return primary;
    if ((primary === 'no' || primary === 'nn') && sup.includes('nb')) return 'nb';
  }
  return null;
}
// Read the device's ui_lang from /api/status, reflect it in the selector, load
// its UI pack, and (if only the fallback was served) poll until the real
// locale pack downloads. On FIRST contact (the device still on its "en"
// default, ui_lang_set === false) adopt the browser's preferred supported
// language and persist it — this also localizes the status mail and the
// announcement — without overriding a real user choice on later visits.
function loadDeviceLang(){
  return fetch('api/status').then(r => r.ok ? r.json() : null).then(d => {
    noteI18nState(d && d.i18n);
    LANG = (d && d.ui_lang) ? String(d.ui_lang) : 'en';
    if (d && d.ui_lang_set === false){
      const auto = pickBrowserLang();
      if (auto && auto !== LANG){
        LANG = auto;
        try {
          fetch('api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({ ui_lang: auto }).toString(),
          }).catch(() => {});   // device adopts it + starts downloading the pack
        } catch (_){}
      }
    }
    document.documentElement.lang = LANG;
    const sel = document.getElementById('langSelect');
    if (sel) sel.value = LANG;
    return loadUiPack(LANG).then(() => awaitUiPack(LANG));
  }).catch(() => {});
}
// The firmware downloads the active locale's pack; the device serves the
// English fallback meanwhile. Poll until it serves the real locale
// (@@locale === lang), then re-render. Bounded so it can't spin forever.
// (en is the embedded fallback → already "real", so it stops immediately.)
function awaitUiPack(lang, tries){
  tries = tries || 0;
  if (LANG !== lang) return;                          // user switched again
  if (I18N[lang] && I18N[lang]['@@locale'] === lang) { setLangStatus(''); return; }
  // The device says no pack is coming for this locale — say so at once instead
  // of polling. Re-checked on every tick, so a download that fails mid-poll
  // also stops here rather than running the bound out.
  if (!i18nPackPending(lang)) { setLangStatus('unavailable'); return; }
  if (tries > 30) { setLangStatus('unavailable'); return; }  // gave up polling
  setLangStatus('loading');
  // Paused in a hidden tab without using up a try (whenVisible()).
  setTimeout(() => whenVisible(() => {
    if (LANG !== lang) return;
    fetch('api/i18n/ui').then(r => r.ok ? r.json() : null).then(dict => {
      if (LANG !== lang) return;
      if (storePack(lang, dict) === lang) { setLangStatus(''); route(); }
      else awaitUiPack(lang, tries + 1);
    }).catch(() => awaitUiPack(lang, tries + 1));
  }), 2000);
}

// --- helpers --------------------------------------------------------

const $ = id => document.getElementById(id);

function esc(s){
  if (s === null || s === undefined || s === '') return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;');
}

// Render the firmware version as a link to its release notes on GitHub.
// A clean release (1.3.4) or a pre-release (1.3.4-rc1) links to the
// suffix-stripped base — so an rc points at the upcoming X.Y.Z notes
// (which release.sh requires to exist). A git-describe dev build
// ("1.3.4-5-gabcdef", note the second hyphen) and the "–" placeholder
// stay plain text. Returns an HTML fragment, so the caller must assign
// it via innerHTML (with the other fields escaped).
function fwLink(v){
  v = v || '–';
  const m = v.match(/^(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.]+)?$/);
  if (!m) return esc(v);
  const url = 'https://github.com/haumacher/phoneblock/blob/master/'
            + 'phoneblock-dongle/firmware/release-notes/' + m[1] + '.md';
  return '<a href="' + esc(url) + '" target="_blank" rel="noopener">'
       + esc(v) + '</a>';
}

function fmtSec(s){
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + ' s';
  if (s < 3600) return Math.round(s/60) + ' min';
  if (s < 86400) return Math.round(s/3600) + ' h';
  return Math.round(s/86400) + ' T';
}

// Absolute point in time for an event the dongle reported as `ageS`
// seconds old. We reconstruct the instant from the *browser's* own wall
// clock (now - age) rather than the device clock: the browser always has
// an accurate time and the correct local zone, so the rendering works
// even before the dongle's SNTP sync and never disagrees with the user's
// own "today"/"yesterday". `withSeconds` adds second precision for the
// fine-grained log; the call list stays at minute precision.
function fmtClock(ageS, withSeconds){
  const locale = (typeof navigator !== 'undefined' && navigator.language) || LANG;
  const d = new Date(Date.now() - Math.max(0, ageS) * 1000);
  const time = d.toLocaleTimeString(locale, withSeconds
    ? {hour: '2-digit', minute: '2-digit', second: '2-digit'}
    : {hour: '2-digit', minute: '2-digit'});
  const midnight = x => { const c = new Date(x); c.setHours(0, 0, 0, 0); return c.getTime(); };
  const today = midnight(Date.now());
  const day   = midnight(d);
  if (day === today)             return t('status.time.today',     {time});
  if (day === today - 86400000)  return t('status.time.yesterday', {time});
  return d.toLocaleDateString(locale, {day: 'numeric', month: 'numeric'}) + ' ' + time;
}

async function fetchJson(url){
  try { const r = await fetch(url); return r.ok ? r.json() : null; }
  catch(e){ return null; }
}

// --- timezone (learn from the browser, push to the dongle) ----------
// The dongle's newlib has no IANA database, so it needs a POSIX TZ string
// ("CET-1CEST,M3.5.0,M10.5.0/3"), not "Europe/Berlin". Curated strings for
// the zones we serve give a canonical result for the European majority
// (matching the firmware default exactly → no spurious "change?" button);
// browserPosixTZ() derives one from the browser's own DST rules otherwise.
const CET = 'CET-1CEST,M3.5.0,M10.5.0/3';
const EET = 'EET-2EEST,M3.5.0/3,M10.5.0/4';
const BST = 'GMT0BST,M3.5.0/1,M10.5.0';
const TZ_TABLE = {
  'Europe/Berlin':CET,'Europe/Vienna':CET,'Europe/Zurich':CET,'Europe/Paris':CET,
  'Europe/Madrid':CET,'Europe/Rome':CET,'Europe/Amsterdam':CET,'Europe/Brussels':CET,
  'Europe/Luxembourg':CET,'Europe/Warsaw':CET,'Europe/Prague':CET,'Europe/Budapest':CET,
  'Europe/Copenhagen':CET,'Europe/Stockholm':CET,'Europe/Oslo':CET,'Europe/Belgrade':CET,
  'Europe/Ljubljana':CET,'Europe/Bratislava':CET,'Europe/Zagreb':CET,'Europe/Sarajevo':CET,
  'Europe/London':BST,'Europe/Dublin':BST,'Europe/Lisbon':'WET0WEST,M3.5.0/1,M10.5.0',
  'Europe/Athens':EET,'Europe/Helsinki':EET,'Europe/Bucharest':EET,'Europe/Kiev':EET,
  'Europe/Kyiv':EET,'Europe/Riga':EET,'Europe/Sofia':EET,'Europe/Tallinn':EET,'Europe/Vilnius':EET,
  'Europe/Moscow':'MSK-3','Europe/Istanbul':'<+03>-3','UTC':'UTC0','Etc/UTC':'UTC0',
};

function detectZone(){
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch(_){ return ''; }
}

function browserPosixTZ(){
  const z = detectZone();
  if (TZ_TABLE[z]) return TZ_TABLE[z];
  try {
    const y = new Date().getFullYear();
    const offAt = d => -d.getTimezoneOffset();          // minutes east of UTC
    const jan = offAt(new Date(y,0,1,12)), jul = offAt(new Date(y,6,1,12));
    const std = Math.min(jan,jul), dst = Math.max(jan,jul);
    const fmt = mins => {                                // POSIX: west positive
      const tot = -mins, sign = tot<0?'-':'+', a = Math.abs(tot);
      const hh = Math.floor(a/60), mm = a%60;
      return sign + hh + (mm ? ':'+String(mm).padStart(2,'0') : '');
    };
    const abbr = m => {
      try {
        const p = new Intl.DateTimeFormat('en',{timeZoneName:'short'})
          .formatToParts(new Date(y,m,1)).find(x=>x.type==='timeZoneName');
        return p && /^[A-Za-z]{2,5}$/.test(p.value) ? p.value : null;
      } catch(_){ return null; }
    };
    const stdName = abbr(0) || ('<'+fmt(std)+'>');
    if (std === dst) return stdName + fmt(std);          // no DST
    const dstName = abbr(6) || ('<'+fmt(dst)+'>');
    let prev = offAt(new Date(y,0,1,12)); const tr = [];
    for (let m=0;m<12;m++){
      const dim = new Date(y,m+1,0).getDate();
      for (let d=1;d<=dim;d++){
        const cur = offAt(new Date(y,m,d,12));
        if (cur !== prev){ tr.push({date:new Date(y,m,d), inc:cur>prev}); prev=cur; }
      }
    }
    const spring = tr.find(x=>x.inc), fall = tr.find(x=>!x.inc);
    if (!spring || !fall) return null;
    const rule = dt => {
      const m = dt.getMonth()+1, dow = dt.getDay(), dom = dt.getDate();
      const dim = new Date(dt.getFullYear(),m,0).getDate();
      let wk = Math.ceil(dom/7); if (dom+7 > dim) wk = 5;   // 5 = last
      return 'M'+m+'.'+wk+'.'+dow;
    };
    return stdName+fmt(std)+dstName+fmt(dst)+','+rule(spring.date)+','+rule(fall.date);
  } catch(_){ return null; }
}

let g_tzPosix;   // computed once, lazily
function applyTz(deviceTz){
  const cur = $('tzCurrent'), btn = $('tzApply');
  if (!cur || !btn) return;
  cur.textContent = t('status.tz.current', { tz: deviceTz || '–' });
  if (g_tzPosix === undefined) g_tzPosix = browserPosixTZ();
  if (g_tzPosix && deviceTz && g_tzPosix !== deviceTz){
    btn.style.display = '';
    btn.textContent = t('status.tz.apply', { zone: detectZone() || g_tzPosix });
    btn.onclick = async () => {
      btn.disabled = true;
      const body = new URLSearchParams();
      body.append('timezone', g_tzPosix);
      try {
        const r = await fetch('api/config', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: body.toString(),
        });
        if (r.ok) cur.textContent = t('status.tz.saved');
      } catch(_){ /* next poll reconciles */ }
      btn.disabled = false;
      refreshAll();   // re-reads the device tz; hides the button once applied
    };
  } else {
    btn.style.display = 'none';
  }
}

async function postForm(url, form){
  const body = new URLSearchParams();
  for (const [k, v] of new FormData(form).entries()) body.append(k, v);
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: body.toString(),
    });
    const d = await r.json().catch(() => ({}));
    return { ok: r.ok && d.ok, data: d, statusText: r.statusText };
  } catch (err) {
    return { ok: false, data: {}, statusText: 'Network error' };
  }
}

// --- add caller to the Fritz!Box phonebook ---------------------------
//
// A caller the box could not resolve arrives without a display name and
// shows up nameless in the call list. Writing them into a Fritz!Box
// phonebook makes the box announce the name on the next call — which also
// means the dongle stops asking PhoneBlock about them (is_known_contact
// short-circuits) and, with "log known calls" off, they disappear from the
// list entirely.
//
// Numbers we may offer this for: plain E.164 / national, no internal dial
// codes (**622, *21#) — the same shape tr064_number_plausible() accepts.
const PLAIN_NUMBER = /^\+?[0-9]{3,31}$/;

const PB_TYPES = ['home', 'mobile', 'work', 'fax_home', 'fax_work'];

let pbDlgEl = null;      // the dialog, built once and reused
let pbDlgNumber = '';    // number the open dialog is about

// Fill a <select> with the box's phonebooks. Synced books (CardDAV,
// Google) are listed but disabled: the box rejects writes to them, and
// showing them explains why the one the user might look for is missing.
async function pbLoadBooks(sel, msgEl){
  sel.innerHTML = '';
  const r = await fetchJson('api/phonebooks');
  if (!r || !r.ok){
    if (msgEl) pbSetMsg(msgEl, pbErrorText(r), 'var(--err)');
    return false;
  }
  let writable = 0;
  for (const b of (r.phonebooks || [])){
    const o = document.createElement('option');
    o.value = String(b.id);
    o.textContent = b.writable ? b.name
                  : t('pb.dialog.book.readonly', {name: b.name});
    o.disabled = !b.writable;
    o.dataset.name = b.name;
    if (b.writable){
      writable++;
      if (String(b.id) === String(r.selected)) o.selected = true;
    }
    sel.appendChild(o);
  }
  if (!writable){
    if (msgEl) pbSetMsg(msgEl, t('pb.dialog.none_writable'), 'var(--err)');
    return false;
  }
  return true;
}

function pbSetMsg(el, text, colour){
  el.textContent = text;
  el.style.color = colour || 'var(--muted)';
}

// Map the endpoints' stable `code` to localized text; fall back to the
// English `message` the firmware sent for codes we don't know.
function pbErrorText(d){
  const code = d && d.code;
  if (code === 'no_fritzbox')   return t('pb.dialog.error.no_fritzbox');
  if (code === 'not_writable')  return t('pb.dialog.error.not_writable');
  if (code === 'invalid_name')  return t('pb.dialog.error.name');
  if (code === 'invalid_number') return t('pb.dialog.error.number');
  return t('pb.dialog.error.generic',
           {msg: (d && d.message) || t('pb.dialog.error.unreachable')});
}

// Built fresh on every open rather than cached: the labels come from t(),
// and the user can switch UI language between two opens (the rest of the
// UI re-renders for that, a cached dialog would keep the old language).
function pbBuildDialog(){
  if (pbDlgEl) pbDlgEl.remove();
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.style.display = 'none';
  wrap.innerHTML = ''
    + '<div>'
    + '<h3>' + esc(t('pb.dialog.title')) + '</h3>'
    + '<p class="muted">' + esc(t('pb.dialog.intro')) + '</p>'
    + '<p class="status-line"><strong id="pbDlgNum"></strong></p>'
    + '<label>' + esc(t('pb.dialog.name'))
    + '<input type="text" id="pbName" maxlength="47" autocomplete="off"></label>'
    + '<label>' + esc(t('pb.dialog.type'))
    + '<select id="pbType">'
    +   PB_TYPES.map(ty => '<option value="' + ty + '">'
    +     esc(t('pb.dialog.type.' + ty)) + '</option>').join('')
    + '</select></label>'
    + '<label class="check">'
    + '  <input type="checkbox" id="pbVip">'
    + '  <span>' + esc(t('pb.dialog.vip')) + '</span>'
    + '</label>'
    + '<label id="pbBookRow" style="display:none">' + esc(t('pb.dialog.book'))
    + '<select id="pbBook"></select></label>'
    + '<p id="pbDlgMsg" class="muted msg-line"></p>'
    + '<p class="actions">'
    + '  <button id="pbSave" class="btn-primary">'
    +   esc(t('pb.dialog.save')) + '</button>'
    + '  <button id="pbCancel" class="btn-ghost">'
    +   esc(t('pb.dialog.cancel')) + '</button>'
    + '</p>'
    + '</div>';
  document.body.appendChild(wrap);
  pbDlgEl = wrap;

  $('pbCancel').onclick = () => { wrap.style.display = 'none'; };
  // Clicking the backdrop cancels; clicks inside the card must not.
  wrap.onclick = (e) => { if (e.target === wrap) wrap.style.display = 'none'; };
  $('pbSave').onclick = pbSubmit;
  return wrap;
}

function pbOpenAddContact(number){
  pbBuildDialog();
  pbDlgNumber = number;
  $('pbDlgNum').textContent = number;
  $('pbName').value = '';
  $('pbVip').checked = false;
  $('pbType').selectedIndex = 0;
  $('pbBookRow').style.display = 'none';
  pbSetMsg($('pbDlgMsg'), '');
  $('pbSave').disabled = false;
  pbDlgEl.style.display = 'flex';
  $('pbName').focus();
}

async function pbSubmit(){
  const msg  = $('pbDlgMsg');
  const save = $('pbSave');
  const name = $('pbName').value.trim();
  if (!name){
    pbSetMsg(msg, t('pb.dialog.error.name'), 'var(--err)');
    return;
  }
  save.disabled = true;
  pbSetMsg(msg, t('pb.dialog.working'));

  const body = new URLSearchParams();
  body.append('number', pbDlgNumber);
  body.append('name', name);
  body.append('type', $('pbType').value);
  body.append('vip', $('pbVip').checked ? '1' : '0');
  // Only sent when the user actually picked a target: the firmware
  // persists the selection only for an explicit pick that then worked.
  const bookRow = $('pbBookRow');
  const book    = $('pbBook');
  if (bookRow.style.display !== 'none' && book.value){
    body.append('phonebook_id', book.value);
    const opt = book.options[book.selectedIndex];
    body.append('phonebook_name', (opt && opt.dataset.name) || '');
  }

  let d = {};
  let ok = false;
  try {
    const r = await fetch('api/phonebook/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: body.toString(),
    });
    d  = await r.json().catch(() => ({}));
    ok = r.ok && d.ok;
  } catch (_){ /* handled as a failure below */ }

  if (ok){
    pbSetMsg(msg, t('pb.dialog.done'), 'var(--ok)');
    setTimeout(() => { if (pbDlgEl) pbDlgEl.style.display = 'none'; }, 700);
    await refreshAll();
    return;
  }
  // "No phonebook chosen yet" and "that one is read-only" are both
  // answered by showing the picker rather than by an error the user can
  // do nothing with.
  if (d.code === 'no_phonebook' || d.code === 'not_writable'
      || d.code === 'phonebook_moved'){
    bookRow.style.display = '';
    const loaded = await pbLoadBooks($('pbBook'), msg);
    if (loaded){
      const warn = d.code === 'not_writable' || d.code === 'phonebook_moved';
      pbSetMsg(msg, d.code === 'not_writable' ? t('pb.dialog.error.not_writable')
                  : d.code === 'phonebook_moved' ? t('pb.dialog.error.moved')
                  : t('pb.dialog.pick'),
               warn ? 'var(--err)' : 'var(--muted)');
    }
    save.disabled = false;
    return;
  }
  pbSetMsg(msg, pbErrorText(d), 'var(--err)');
  save.disabled = false;
}

// Transport is always connection-oriented (TLS or TCP), never UDP: only a
// persistent connection lets the registrar push an incoming INVITE back
// through the NAT of a home router. UDP registers fine but cannot receive
// calls behind a router, so it is useless for the dongle's purpose.
//
// `port: 0` means "auto" — the firmware resolves the endpoint via DNS-SRV
// and uses the port the SRV record advertises. Telekom only publishes an
// SRV record (_sips._tcp.tel.t-online.de) and no A record on the bare
// domain, so a hard-coded port would skip SRV and the direct A lookup
// would fail (#363). `anonymous: true` registers via anonymous@t-online.de
// with no password — the simplest path for the user, who then only types
// the phone number.

  telekom: {
    name: 'Telekom MagentaZuhause',

    transport: 'tls',

    anonymous: true,
    // Telekom's own STUN — lets the dongle advertise its real post-NAT RTP
    // port in the SDP instead of the unmapped local port.

const app = $('app');
let pollTimer = null;
// True between the click on "Auf Aktualisierung prüfen" and the
// response from /api/firmware/check. firmware_try_update writes the
// pessimistic last_failed_ota marker *before* the download starts, so
// any /api/status poll that lands during the install would otherwise
// flash up the rollback banner for the version we are actively
// installing — which is the opposite of what the marker is meant to
// signal. The flag suppresses that banner while a check is in flight.
let fwUpdateInFlight = false;

// --- status poll, paused in a hidden tab (#573) ---------------------- <poll-lib>
// Whether the current view wants the status poll. The interval itself only
// runs while the tab is visible: a hidden tab polling every 3 s with three
// requests is ~1 request/s against the device (and as many DNS lookups,
// #573) for nobody to see. Coming back refreshes at once.
let pollWanted = false;

function startPolling(){
  pollWanted = true;
  if (!pollTimer && !document.hidden) pollTimer = setInterval(refreshAll, 3000);
}

// Ends the poll for good (until the next startPolling()): a route change,
// or a device that is about to reboot.
function stopPolling(){
  pollWanted = false;
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

// Runs `fn` now if the tab is visible, otherwise once it becomes visible —
// for timers whose work only matters to someone looking at the page.
function whenVisible(fn){
  if (!document.hidden) { fn(); return; }
  const onShow = () => {
    if (document.hidden) return;
    document.removeEventListener('visibilitychange', onShow);
    fn();
  };
  document.addEventListener('visibilitychange', onShow);
}

// The phoneblock.net sign-in tab closing itself (or the user switching
// back) makes this tab visible again: the refresh shows the stored token
// right away.
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  } else if (pollWanted && !pollTimer){
    refreshAll();
    pollTimer = setInterval(refreshAll, 3000);
  }
});
// </poll-lib>

function route(){
  stopPolling();
  const hash = location.hash || '#/';
  const [_, section, subsection] = hash.split('/');
  const homeLink = $('homeLink');
  homeLink.textContent = hash === '#/' ? '' : t('back.status');
  if (section === 'setup' && subsection === 'sip'){
    const sub = hash.split('/')[3] || '';
    if (sub === 'fritzbox') return renderSipFritzbox();
    if (sub === 'provider') return renderSipProvider();
    if (sub === 'manual')   return renderSipManual();
    return renderSipEntry();
  }
  if (section === 'setup' && subsection === 'token') return renderToken();
  return renderStatus();
}

window.addEventListener('hashchange', route);

// The phoneblock.net sign-in runs in its own tab. Opening it from script
// (instead of target="_blank") is what allows /token-callback to close
// that tab again when the token is stored; this tab follows the result on
// the status page, whose token pill turns green with the next poll. No
// "noopener": it would make window.open() return null, hiding a blocked
// popup — then the link simply navigates in place, as before.
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[data-token-link]');
  if (!a || !window.open(a.href, '_blank')) return;
  e.preventDefault();
  if ((location.hash || '#/') !== '#/') location.hash = '#/';
});

function renderHero(sipDone, tokenDone){

  const step = (done, num, labelKey, ctaKey, href) =>
      '<div class="hero-step' + (done ? ' done' : '') + '">'
    + '<div class="mark">' + (done ? '✓' : num) + '</div>'

  slot.innerHTML = ''
    + '<section class="hero">'
    + '<h2>' + esc(t('hero.title')) + '</h2>'

    + step(sipDone,   '1',
           sipDone   ? 'hero.step1.done' : 'hero.step1.todo',
