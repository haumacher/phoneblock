// The device-code link (#621): under Home Assistant ingress the redirect
// from phoneblock.net cannot come back into the page, so the service asks
// phoneblock.net for a code, the user types it in there, and the service
// collects the token itself (web.c /api/link/*). This page shows the code
// first and opens phoneblock.net only on a second click: the code is never
// carried in the link, so a forwarded link cannot confirm anything.
async function startLink(btn, panel){
  // While a link runs, nothing on the page may start another one: the
  // start button and its explanation go away; a failed link offers its own
  // retry button in the panel.
  $('linkStartRow').hidden = true;
  $('tokenHow').hidden = true;
  panel.innerHTML = '<p class="status-line muted">' + esc(t('link.starting')) + '</p>';
  let r = null;
  try {
    const resp = await fetch('api/link/start', {method: 'POST'});
    r = await resp.json();
  } catch(e){ r = null; }
  if (!r || !r.userCode || !/^https?:\/\//.test(r.verifyUrl || '')){
    linkEnded(btn, panel, 'error', r && r.message);
    return;
  }
  panel.innerHTML = ''
    + '<div class="link-row">'
    +   '<p class="link-code" id="linkCode" dir="ltr">' + esc(r.userCode) + '</p>'
    +   '<button id="linkCopy" class="btn-ghost btn-sm">' + esc(t('link.copy')) + '</button>'
    + '</div>'
    + '<p id="linkCopyMsg" class="hint" hidden></p>'
    + '<p>' + esc(t('link.compare')) + '</p>'
    + '<p class="actions" id="linkOpenRow"><a id="linkOpen" class="btn-primary" target="_blank" rel="noopener" href="'
    +   esc(r.verifyUrl) + '">' + esc(t('link.open')) + '</a></p>'
    + '<p id="linkMsg" class="status-line" hidden>' + esc(t('link.waiting')) + '</p>'
    + '<p class="hint">' + esc(t('link.manual')).replace('{url}',
        '<a target="_blank" rel="noopener" href="' + esc(r.verifyUrl) + '">' + esc(r.verifyUrl) + '</a>')
    + '</p>';
  $('linkCopy').onclick = () => copyLinkCode($('linkCode'), $('linkCopyMsg'), r.userCode);
  // Once phoneblock.net is open, the button has done its job: in its place
  // the page says what it is waiting for (the address stays in the hint
  // below, should the tab get lost).
  $('linkOpen').addEventListener('click', () => {
    $('linkOpenRow').hidden = true;
    $('linkMsg').hidden = false;
  });
  for (;;){
    await new Promise(res => setTimeout(res, 2000));
    // Left the page: the service keeps polling on its own; the status
    // page shows the token once it arrived.
    if (!document.body.contains(panel)) return;
    const st = await fetchJson('api/link/status');
    if (!st || st.state === 'pending') continue;
    if (st.userCode !== r.userCode) return;   // a newer link took over
    linkEnded(btn, panel, st.state, st.message);
    return;
  }
}

// Copies the link code. navigator.clipboard needs a secure context and,
// inside the Home Assistant iframe, the clipboard-write permission; over
// plain http neither may hold, so the old execCommand path follows, and
// as the last resort the code is selected for Ctrl+C.
async function copyLinkCode(codeEl, msg, code){
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(code);
      ok = true;
    }
  } catch(e){ ok = false; }
  if (!ok){
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
  }
  if (!ok){
    const range = document.createRange();
    range.selectNodeContents(codeEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  msg.textContent = t(ok ? 'link.copied' : 'link.copy_failed');
  msg.className = ok ? 'hint txt-ok' : 'hint';
  msg.hidden = false;
}

function linkEnded(btn, panel, state, message){
  if (state === 'approved'){
    const current = $('tokenCurrent');
    if (current) current.textContent = t('token.current.set');
    panel.innerHTML = '<p class="status-line txt-ok">' + esc(t('link.approved')) + '</p>';
    // Back to the status page, whose next poll turns the token pill green.
    setTimeout(() => { if ((location.hash || '#/') === '#/setup/token') location.hash = '#/'; }, 1500);
    return;
  }
  const key = state === 'denied' ? 'link.denied'
            : state === 'expired' ? 'link.expired' : 'link.error';
  panel.innerHTML = ''
    + '<p class="status-line txt-err">' + esc(t(key, {msg: message || '–'})) + '</p>'
    + '<p class="actions"><button class="btn-ghost btn-sm">' + esc(t('link.retry')) + '</button></p>';
  panel.querySelector('button').onclick = () => startLink(btn, panel);
}

// --- announcement (G.711 A-law, 8 kHz mono) ------------------------

const ANN_MAX_SECONDS = 30;

// ITU-T G.711 A-law encode: 16-bit PCM → 8-bit A-law.
function pcm16ToAlaw(sample){
  const sign = (sample >> 8) & 0x80;
  if (sign) sample = -sample;
  if (sample > 32635) sample = 32635;
  let exponent, mantissa;
  if (sample >= 256){
    exponent = 7;
    for (let mask = 0x4000; (sample & mask) === 0 && exponent > 1; mask >>= 1) exponent--;
    mantissa = (sample >> (exponent + 3)) & 0x0f;
  } else {
    exponent = 0;
    mantissa = (sample >> 4) & 0x0f;
  }
  return (sign | (exponent << 4) | mantissa) ^ 0x55;
}

function alawToPcm16(alaw){
  alaw ^= 0x55;
  const sign = alaw & 0x80;
  const exponent = (alaw >> 4) & 0x07;
  const mantissa = alaw & 0x0f;
  let sample;
  if (exponent === 0){
    sample = (mantissa << 4) + 8;
  } else {
    sample = ((mantissa << 4) + 0x108) << (exponent - 1);
  }
  return sign ? -sample : sample;
}

// Wrap a PCM16 mono 8 kHz sample array into a Blob the browser's
// <audio> element plays natively.
function wavBlobFromPcm16(pcm){
  const dataBytes = pcm.length * 2;
  const buf = new ArrayBuffer(44 + dataBytes);
  const v = new DataView(buf);
  // RIFF header
  v.setUint32(0,  0x52494646, false); // "RIFF"
  v.setUint32(4,  36 + dataBytes, true);
  v.setUint32(8,  0x57415645, false); // "WAVE"
  // fmt chunk
  v.setUint32(12, 0x666d7420, false); // "fmt "
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);           // PCM
  v.setUint16(22, 1, true);           // mono
  v.setUint32(24, 8000, true);        // rate
  v.setUint32(28, 16000, true);       // byte rate = 8000 * 2
  v.setUint16(32, 2, true);           // block align
  v.setUint16(34, 16, true);          // bits
  v.setUint32(36, 0x64617461, false); // "data"
  v.setUint32(40, dataBytes, true);
  for (let i = 0; i < pcm.length; i++) v.setInt16(44 + i * 2, pcm[i], true);
  return new Blob([buf], {type: 'audio/wav'});
}

// Level processing of every uploaded recording (own announcement and the
// clips of an own dialog set), ported from scripts/tts-dialog.py trim() and
// normalize() so own clips sound like the published ones. The constants are
// tts-dialog.py's TRIM_DBFS, TRIM_KEEP_MS, TARGET_DBFS, PEAK_DBFS and
// ACTIVE_DBFS — keep both in step. <pcm-lib>
const TRIM_DBFS = -45, TRIM_KEEP_MS = 50;
const TARGET_DBFS = -20, PEAK_DBFS = -1, ACTIVE_DBFS = -50;
const dbfs = x => 20 * Math.log10(Math.max(x, 1e-9) / 32768);
// Leading/trailing 10 ms windows whose peak stays below TRIM_DBFS go,
// TRIM_KEEP_MS kept on each side. null when no window is louder (silence).
function trimPcm(pcm){
  const win = 80, thr = 32768 * 10 ** (TRIM_DBFS / 20);
  let first = -1, last = -1;
  for (let i = 0; i < pcm.length; i += win){
    let m = 0;
    for (let j = i; j < Math.min(i + win, pcm.length); j++) m = Math.max(m, Math.abs(pcm[j]));
    if (m > thr){ if (first < 0) first = i; last = i; }
  }
  if (first < 0) return null;
  const keep = TRIM_KEEP_MS * 8;
  return pcm.slice(Math.max(0, first - keep), Math.min(pcm.length, last + win + keep));
}
// Gain to TARGET_DBFS RMS over the 20 ms frames above ACTIVE_DBFS, capped so
// no peak exceeds PEAK_DBFS. Unchanged without such a frame.
function normalizePcm(pcm){
  const thr = 32768 * 10 ** (ACTIVE_DBFS / 20);
  let sum = 0, frames = 0, peak = 0;
  for (let i = 0; i + 160 <= pcm.length; i += 160){
    let e = 0;
    for (let j = i; j < i + 160; j++) e += pcm[j] * pcm[j];
    if (Math.sqrt(e / 160) > thr){ sum += e; frames++; }
  }
  if (!frames) return pcm;
  for (const v of pcm) peak = Math.max(peak, Math.abs(v));
  const gain = 10 ** (Math.min(TARGET_DBFS - dbfs(Math.sqrt(sum / (160 * frames))),
                               PEAK_DBFS - dbfs(peak)) / 20);
  return Int16Array.from(pcm, v => Math.max(-32768, Math.min(32767, Math.round(v * gain))));
}
// </pcm-lib>

// Decode any browser-supported audio file, mix to mono, resample to
// 8 kHz via OfflineAudioContext, trim and level it (above), then
// A-law-encode. Returns a Uint8Array of raw A-law bytes, ready to POST to
// /api/announcement or to put into a dialog set. A file that is silent
// throughout is refused with a message.
async function convertToAlaw(file, maxSeconds = ANN_MAX_SECONDS){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try {
    decoded = await ctx.decodeAudioData(await file.arrayBuffer());
  } catch (e){
    ctx.close();
    throw new Error(t('status.ann.upload.decode_fail'));
  }
  const lengthSamples = Math.ceil(decoded.duration * 8000);
  if (decoded.duration > maxSeconds){
    ctx.close();
    throw new Error(t('status.ann.upload.toolong', {s: maxSeconds}));
  }
  if (lengthSamples < 1){
    ctx.close();
    throw new Error(t('status.ann.upload.silent'));
  }
  const off = new OfflineAudioContext(1, lengthSamples, 8000);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  ctx.close();
  const pcm = Int16Array.from(rendered.getChannelData(0),
                              f => Math.round(Math.max(-1, Math.min(1, f)) * 32767));
  const trimmed = trimPcm(pcm);
  if (!trimmed) throw new Error(t('status.ann.upload.silent'));
  return Uint8Array.from(normalizePcm(trimmed), pcm16ToAlaw);
}

// Plays raw A-law bytes; returns the Audio element (onended: cleanup).
function playAlaw(alaw){
  const pcm = Int16Array.from(alaw, alawToPcm16);
  const url = URL.createObjectURL(wavBlobFromPcm16(pcm));
  const a = new Audio(url);
  a.addEventListener('ended', () => URL.revokeObjectURL(url));
  a.play();
  return a;
}

// --- dialog set (#429): the PBDS file of main/dialog.h ---------------- <dlg-lib>
const DLG_PHASES = ['hello', 'who-is-there', 'am-aparat', 'question', 'cant-hear-you'];
const DLG_MAX_CLIPS = 32;
// ph: five arrays of Uint8Array clips → the set file: "PBDS", version 1, P = 5,
// u16 header length, the clip counts, per clip u32 offset + u32 length
// (little endian), then the clips in phase order.
function dlgBuild(ph){
  const n = ph.reduce((a, c) => a + c.length, 0), h = 13 + 8 * n;
  const out = new Uint8Array(ph.flat().reduce((a, c) => a + c.length, h));
  const v = new DataView(out.buffer);
  out.set([0x50, 0x42, 0x44, 0x53, 1, 5]);
  v.setUint16(6, h, true);
  let e = 13, off = h;
  ph.forEach((clips, p) => {
    out[8 + p] = clips.length;
    for (const c of clips){
      v.setUint32(e, off, true); v.setUint32(e + 4, c.length, true);
      out.set(c, off); e += 8; off += c.length;
    }
  });
  return out;
}
// The set file → five arrays of clips (phases of a later format beyond the
// five are dropped), or null if it is not one.
function dlgParse(b){
  if (b.length < 8 || String.fromCharCode(...b.subarray(0, 4)) !== 'PBDS' || b[4] !== 1) return null;
  const v = new DataView(b.buffer, b.byteOffset, b.length), P = b[5], h = v.getUint16(6, true);
  if (P < 5 || b.length < 8 + P) return null;
  let n = 0;
  for (let p = 0; p < P; p++) n += b[8 + p];
  if (h !== 8 + P + 8 * n || h > b.length) return null;
  const ph = [];
  for (let p = 0, e = 8 + P; p < P; p++){
    const clips = [];
    for (let k = 0; k < b[8 + p]; k++, e += 8){
      const o = v.getUint32(e, true), l = v.getUint32(e + 4, true);
      if (!l || o < h || o + l > b.length) return null;
      clips.push(b.slice(o, o + l));
    }
    if (p < 5) ph.push(clips);
  }
  return ph;
}
// </dlg-lib>

    s.textContent = label;
    if (active) s.className = 'on';
    p.append(s);
    if (active) p.append(Object.assign(document.createElement('span'),
      {className: 'muted', textContent: '✓ ' + t('status.dialog.speaker.active')}));
    else if (choose) p.append(dlgBtn(t('status.dialog.speaker.use'), '', choose));
    box.append(p);
  };
  const choose = (id, name) => async () => {
    if (r.own && !confirm(t('status.dialog.own.replace_confirm', {name}))) return;
    dlgStop();
    await postConfig({dialog_speaker: id}).catch(() => {});
    refreshAll();
  };
  if (!r.speakers.length) box.append(t('status.dialog.speaker.none'));
  r.speakers.forEach(sp => {
    const g = sp.gender === 'female' ? ' ♀' : sp.gender === 'male' ? ' ♂' : '';
    row(sp.name + g, !r.own && r.selected === sp.id,
        sp.preview_url ? () => {
          dlgStop();
          dlgAudio = new Audio(sp.preview_url);
          dlgAudio.play().catch(() => {});
        } : null,
        choose(sp.id, sp.name));
  });
  if (r.own) row(t('status.dialog.own'), true, null, null);
  wireDlgEditor();
}

// The editor's state: five phase lists of A-law clips.
function dlgRender(){
  const box = $('dlgPhases');
  box.textContent = '';
  const ph = dlgEd || [[], [], [], [], []];
  let reason = '';
  ph.forEach((clips, p) => {
    const name = t('status.dialog.phase.' + DLG_PHASES[p]);
    const h = document.createElement('p');
    h.className = 'list-title';
    h.textContent = name + ' (' + clips.length + ')';
    box.append(h);
    clips.forEach((c, k) => {
      const r = document.createElement('div');
      r.className = 'list-row';
      // No order: the dongle picks a phase's clips at random (dialog.c).
      r.append(dlgBtn('▶', t('status.ann.play'), () => dlgPlay(playAlaw(c))),
               dlgBtn('✕', t('status.dialog.edit.delete'), () => { clips.splice(k, 1); dlgDirty = true; dlgRender(); }),
               Object.assign(document.createElement('span'),
                 {className: 'muted', textContent: (c.length / 8000).toFixed(1) + ' s'}));
      box.append(r);
    });
    box.append(dlgBtn(t('status.dialog.edit.add'), '', () => dlgPick(f => { clips.push(f); dlgDirty = true; })));
    if (!reason && !clips.length) reason = t('status.dialog.edit.reason.empty', {phase: name});
    if (!reason && clips.length > DLG_MAX_CLIPS)
      reason = t('status.dialog.edit.reason.many', {phase: name, max: DLG_MAX_CLIPS});
  });
  const bytes = dlgEd ? dlgBuild(ph).length : 0;
  if (!reason && dlgMax && bytes > dlgMax) reason = t('status.dialog.edit.reason.size');
  // The gauge, and why the upload is disabled.
  const gauge = $('dlgGauge');
  gauge.textContent = t('status.dialog.edit.gauge',
    {kb: Math.round(bytes / 1024), max: Math.round(dlgMax / 1024)}) + (reason ? ' — ' + reason : '');
  gauge.style.color = reason ? 'var(--caution)' : '';
  $('dlgUpload').disabled = !!reason || !dlgEd;
  $('dlgUpload').title = reason;
}
// Picks an audio file, converts it like an announcement and hands the
// A-law clip to `put`.
function dlgPick(put){
  const inp = Object.assign(document.createElement('input'), {type: 'file', accept: 'audio/*'});
  inp.onchange = async () => {
    if (!inp.files.length) return;
    dlgMsg(t('status.ann.upload.converting'));
    try { put(await convertToAlaw(inp.files[0])); dlgMsg(''); }
    catch (e){ dlgMsg(t('status.ann.upload.error', {msg: e.message}), 'var(--err)'); }
    dlgRender();
  };
  inp.click();
}
function dlgSaveFile(bytes, name){
  const a = Object.assign(document.createElement('a'),
    {href: URL.createObjectURL(new Blob([bytes])), download: name});
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// Saves the set on the device as a file (before leaving dialog mode).
async function dlgDownloadDevice(){
  try {
    const r = await fetch('api/dialog');
    if (r.ok) dlgSaveFile(new Uint8Array(await r.arrayBuffer()), 'dialog-own.bin');
  } catch (_){}
}
// The status view was rebuilt (a language pack arrived, the view was
// re-entered): the next poll rebuilds the speaker list, wires the new editor
// and loads it on open.
function dlgReset(){
  dlgStop();
  dlgKey = ''; dlgSetKey = null; dlgEd = null; dlgDirty = false; dlgLoading = null;
}
// Loads the editor from the set on the device (none: starts empty).
let dlgLoading = null;
function dlgLoad(){
  if (dlgLoading) return dlgLoading;
  dlgEd = [[], [], [], [], []];
  dlgDirty = false;
  dlgMsg('');
  dlgLoading = (async () => {
    try {
      const r = await fetch('api/dialog');
      const ph = r.ok ? dlgParse(new Uint8Array(await r.arrayBuffer())) : null;
      if (ph) dlgEd = ph;
      else dlgMsg(t('status.dialog.edit.no_set'));
    } catch (_){ dlgMsg(t('status.dialog.edit.no_set')); }
    dlgLoading = null;
    dlgRender();
  })();
  return dlgLoading;
}
// The set on the device changed (a language or speaker switch, the sync
// finished, an own set was stored or dropped): the editor follows, unless it
// holds edits not uploaded yet: those are kept, with an offer to load the new
// set instead.
function dlgSetChanged(d){
  const key = [d.mode, d.clips_present, d.clips_lang, d.clips_speaker, d.own].join('|');
  const uploaded = dlgUploaded;   // the poll after an upload sees its result
  dlgUploaded = false;
  if (key === dlgSetKey) return;
  const first = dlgSetKey === null;
  dlgSetKey = key;
  // Just uploaded from the editor: it already holds what is on the device.
  if (first || !dlgEd || uploaded) return;
  if (dlgDirty){
    dlgMsg(t('status.dialog.edit.changed'), 'var(--caution)');
    $('dlgMsg').append(' ', dlgBtn(t('status.dialog.edit.reload'), '', dlgLoad));
    return;
  }
  dlgEd = null;
  if ($('dlgEdit').open) dlgLoad();
}
function wireDlgEditor(){
  const det = $('dlgEdit');
  if (det.ontoggle) return;
  det.ontoggle = () => { if (det.open && !dlgEd) dlgLoad(); };
  $('dlgSave').onclick = () => dlgEd ? dlgSaveFile(dlgBuild(dlgEd), 'dialog-own.bin')
                                     : dlgDownloadDevice();
  $('dlgFile').onchange = async () => {
    const f = $('dlgFile').files[0];
    $('dlgFile').value = '';
    if (!f) return;
    const ph = dlgParse(new Uint8Array(await f.arrayBuffer()));
    if (!ph){ dlgMsg(t('status.dialog.edit.bad_file'), 'var(--err)'); return; }
    dlgEd = ph;
    dlgDirty = true;
    dlgMsg('');
    dlgRender();
  };
  $('dlgUpload').onclick = async () => {
    const body = dlgBuild(dlgEd);
    const b = $('dlgUpload');
    b.disabled = true;
    dlgMsg(t('status.ann.upload.uploading'));
    try {
      const r = await fetch('api/dialog', {method: 'POST',
        headers: {'Content-Type': 'application/octet-stream'}, body});
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.message || ('HTTP ' + r.status));
      dlgDirty = false;
      dlgUploaded = true;
      dlgMsg(t('status.dialog.edit.done', {kb: Math.round(body.length / 1024)}), 'var(--ok)');
      refreshAll();
    } catch (e){
      dlgMsg(t('status.ann.upload.error', {msg: e.message || 'network'}), 'var(--err)');
    }
    b.disabled = false;
  };
}

// Why there is no dialog set yet (GET /api/status dialog.sync, i18n_sync.h).
function dlgSyncText(d){
  switch (d.sync){
    case 'pending':     return t('status.dialog.clips.pending');
    case 'downloading': return t('status.dialog.clips.downloading', {kb: Math.round((d.sync_bytes || 0) / 1024)});
    case 'failed':      return t('status.dialog.clips.failed', {error: d.sync_error || '?'});
    case 'unavailable': return t('status.dialog.clips.unavailable');
  }
  return t('status.dialog.clips.missing');
}

let annAudio = null;
let annMsgTimer = null;
function setAnnMsg(text, color){
  const el = $('annMsg');
  if (annMsgTimer){ clearTimeout(annMsgTimer); annMsgTimer = null; }
  el.textContent = text || '';
  el.style.color = color || 'var(--muted)';
}

function wireAnnouncement(){
  const playBtn  = $('annPlay');
  const stopBtn  = $('annStop');
  const resetBtn = $('annReset');
  const fileIn   = $('annFile');
  const uploadBtn = $('annUpload');

  playBtn.onclick = async () => {
    setAnnMsg('');
    try {
      const r = await fetch('api/announcement');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const alaw = new Uint8Array(await r.arrayBuffer());
      if (annAudio) annAudio.pause();
      annAudio = playAlaw(alaw);
      annAudio.onended = () => {
        stopBtn.style.display = 'none';
        playBtn.style.display = '';
      };
      playBtn.style.display = 'none';
      stopBtn.style.display = '';
    } catch (e){
      setAnnMsg(t('status.ann.upload.error', {msg: e.message || 'network'}), 'var(--err)');
    }
  };
  stopBtn.onclick = () => {
    if (annAudio){ annAudio.pause(); annAudio.currentTime = 0; }
    stopBtn.style.display = 'none';
    playBtn.style.display = '';
  };

  fileIn.onchange = () => { uploadBtn.disabled = !fileIn.files.length; };

  uploadBtn.onclick = async () => {
    if (!fileIn.files.length) return;
    const file = fileIn.files[0];
    uploadBtn.disabled = true;
    setAnnMsg(t('status.ann.upload.converting'), 'var(--muted)');
    let alaw;
    try {
      alaw = await convertToAlaw(file);
    } catch (e){
      setAnnMsg(t('status.ann.upload.error', {msg: e.message}), 'var(--err)');
      uploadBtn.disabled = false;
      return;
    }
    setAnnMsg(t('status.ann.upload.uploading'), 'var(--muted)');
    try {
      const r = await fetch('api/announcement', {
        method: 'POST',
        headers: {'Content-Type': 'application/octet-stream'},
        body: alaw,
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.message || ('HTTP ' + r.status));
      setAnnMsg(t('status.ann.upload.done', {kb: Math.round(alaw.length / 1024)}), 'var(--ok)');
      fileIn.value = '';
      annMsgTimer = setTimeout(() => setAnnMsg(''), 4000);
      refreshAll();
    } catch (e){
      setAnnMsg(t('status.ann.upload.error', {msg: e.message || 'network'}), 'var(--err)');
    }
    uploadBtn.disabled = !fileIn.files.length;
  };

  resetBtn.onclick = async () => {
    if (!confirm(t('status.ann.reset.confirm'))) return;
    resetBtn.disabled = true;
    setAnnMsg('');
    try {
      const r = await fetch('api/announcement/reset', {method: 'POST'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      refreshAll();
    } catch (e){
      setAnnMsg(t('status.ann.upload.error', {msg: e.message || 'network'}), 'var(--err)');
    }
    resetBtn.disabled = false;
  };
}

// --- language switcher ---------------------------------------------

// Shared by the footer selector (reachable from every route) and the one in
// the region section — same setting, one code path.
function setUiLang(lang){
  // The UI language is a DEVICE setting — it also drives the status mail
  // and the answer-bot announcement. POST it; the firmware localizes those
  // and downloads the matching UI pack, which the dongle then serves at
  // /api/i18n/ui. Re-render now (English until the pack arrives), then poll
  // the device for the new pack.
  LANG = lang;
  document.documentElement.lang = lang;
  const foot = document.getElementById('langSelect');
  if (foot) foot.value = lang;
  try {
    fetch('api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ ui_lang: lang }).toString(),
    }).catch(() => {});
  } catch (_){}
  delete I18N[lang];                 // force reload of the new locale
  // While the device downloads the new pack it serves the embedded English
  // pack (which carries the i18n.loading/unavailable strings), so start the
  // poll only after loadUiPack has populated I18N[lang] — then the status
  // label resolves to real text instead of the raw key on the first switch.
  loadUiPack(lang).then(() => { route(); awaitUiPack(lang); });
}

{
  const sel = document.getElementById('langSelect');
  if (sel){
    sel.value = LANG;
    sel.addEventListener('change', () => setUiLang(sel.value));
  }
  document.documentElement.lang = LANG;
}

// --- boot ----------------------------------------------------------

// The UI language comes from the device (ui_lang); load it + its UI pack from
// the dongle itself (same-origin, no CDN), then render. On any failure t()
// falls back to the embedded English pack the device serves.
loadDeviceLang().then(route);
</script>
